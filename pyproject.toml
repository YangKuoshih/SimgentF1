[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-simgent"
version = "1.4.0"
description = "Autonomous Formula 1 Race Engineering Agent, Strategy Battle Simulator, and 60 FPS Replay Cockpit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Tony Yang" }
]
keywords = [
    "formula-1",
    "f1",
    "telemetry",
    "agentic-ai",
    "gemini",
    "google-cloud-run",
    "fastapi",
    "monte-carlo",
    "race-strategy",
    "a2ui",
    "ergast-api"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.143.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://simgent.tonyyang.work"
Repository = "https://github.com/YangKuoshih/SimgentF1"
Documentation = "https://github.com/YangKuoshih/SimgentF1#readme"
"Bug Tracker" = "https://github.com/YangKuoshih/SimgentF1/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "frontend*"]
