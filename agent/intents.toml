  "what was the grid for the sprint",
  "what was the starting grid",
  "where did Verstappen start",
  "who started second",
  "show me the grid",
  "who was on the front row",
  "what grid slot did Alonso have",
  "who started from the pit lane",
  "where did he line up for the sprint",
]

