# Pit Wall Agent intents: what people ask, mapped to the tools that answer it.
#
# Each table is one intent. `tools` lists the answer types (the `tool` field of a reply) that
# serve it; `examples` are ways people ask; `not` lists near misses that belong elsewhere.
# The router embeds every example and sends a question to the closest intent
# (docs/AGENT_ARCHITECTURE.md). To teach the agent a new phrasing, add an example here and run
#   python tests/eval_router.py
#
# `requires` names what a question must mention for the intent to apply, `excludes` what it must
# not ("driver": a driver name or he/his/they, "position": P3/third/runner-up, "year",
# "segment": Q1-Q3 or SQ1-SQ3); names and years are masked
# before matching, so the router learns the shape of a question, not who it is about.
#
# `canonical` is how the engine is asked when the router is confident about the intent but the
# engine's first answer doesn't fit it (step 3a). Placeholders come from the question:
# {driver} {driver2} (driver names; {driver_poss} = Hamilton's / his), {position} (P3, third...), {segment} (Q1..SQ3),
# {year}, {race} (year and race/circuit/country words, e.g. "in the 2021 abu dhabi grand prix"),
# {race_name} ("the 2021 abu dhabi grand prix", or "this race").
# A placeholder that the question doesn't fill drops out (with its "in the" if any); an intent
# without `canonical` is never rewritten.
#
# Write examples the way a person would type them. Use real names and races where it helps;
# the router learns the shape of the question, the slots (race, driver, session) are parsed
# separately from the data.

[session_result]
description = "Who won a race, sprint or session, the podium, top N or full classification"
canonical = "who won {race}"
excludes = ["segment"]
tools = ["race_classification_lookup", "sprint_classification_lookup",
         "qualifying_classification_lookup", "sprint_qualifying_classification_lookup"]
examples = [
  "who won",
  "who won the race",
  "who won the grand prix",
  "who took the win today",
  "who won the sprint",
  "what was the podium",
  "who finished on the podium",
  "show me the top 10",
  "final classification please",
  "what were the results",
  "who came out on top in Monaco",
  "race result for the British Grand Prix",
]
not = ["who won the championship", "how many races has he won"]

[pole_position]
description = "Pole position or the fastest qualifier, for Grand Prix or Sprint Qualifying"
canonical = "who was on pole {race}"
excludes = ["segment"]
tools = ["qualifying_pole_lookup", "sprint_qualifying_lookup", "qualifying_classification_lookup",
         "sprint_qualifying_classification_lookup"]
examples = [
  "who was on pole for the Australian Grand Prix",
  "who started on pole in that race",
  "who was fastest",
  "who was quickest",
  "who was on pole",
  "who got pole position",
  "who took sprint pole",
  "who was fastest in qualifying",
  "who qualified first",
  "who topped qualifying",
  "pole time at Monza",
  "who starts from pole tomorrow",
  "who was quickest in the shootout",
]

[finishing_position]
description = "Who finished in a given position"
canonical = "who finished {position} {race}"
requires = ["position"]
tools = ["driver_finish_position_lookup", "sprint_position_lookup",
         "qualifying_position_lookup", "sprint_qualifying_position_lookup"]
examples = [
  "who finished second in the British Grand Prix",
  "who came third in that race",
  "who finished fifth at Monza",
  "who came second",
  "who was second in the 2019 race",
  "who finished second",
  "who was P3",
  "who came fourth",
  "who finished in tenth place",
  "who was the runner up",
  "who qualified P2",
  "who was fifth in the sprint",
  "who finished just off the podium",
]

[driver_result]
description = "How a named driver did in a race or session: position, grid, laps, points"
canonical = "how did {driver} do {race}"
requires = ["driver"]
tools = ["driver_performance_lookup", "driver_classification_lookup", "sprint_driver_lookup",
         "qualifying_driver_lookup", "sprint_qualifying_driver_lookup", "weekend_driver_summary"]
examples = [
  "how did Hamilton do",
  "where did Leclerc finish",
  "how did he get on",
  "what position did Norris finish",
  "where did Piastri qualify",
  "how was Alonso's race",
  "what happened to Russell in the sprint",
  "how many points did Verstappen score today",
  "what was Leclerc's best lap",
  "how did Lindblad do in his first race",
]
not = ["how did the race go", "how many podiums does Hamilton have in his career"]

