name: Bug report
description: Something in the app, replay or Pit Wall Agent does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, admin tokens, personal data or conversation records.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the 2026 Miami Grand Prix replay\n2. ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Live site, local run (OS and Python version), or Docker.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
