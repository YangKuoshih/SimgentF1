name: Deploy to Google Cloud Run

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions web UI

permissions:
  contents: read

jobs:
  test:
    name: Run Pre-Deploy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --require-hashes -r requirements.txt

      - name: Run Test Suite
        run: python -m unittest discover tests

      - name: Run Season Accuracy & Robustness Suite
        run: python tests/test_season_robustness.py

  deploy:
    name: Deploy to GCP Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless auth: GitHub OIDC token exchanged via Workload Identity Federation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Google Cloud only trusts this repository's main branch (provider attribute condition);
      # no service-account key exists or is stored in GitHub.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/1068081209515/locations/global/workloadIdentityPools/github/providers/simgentf1
          service_account: simgent-deployer@f1-simgent.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: f1-simgent

      - name: Deploy Container with Bounded Autoscaling
        run: |
          gcloud run deploy f1-simgent \
            --source . \
            --region us-central1 \
            --project f1-simgent \
            --service-account simgent-runtime@f1-simgent.iam.gserviceaccount.com \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 80 \
            --cpu-throttling \
            --quiet
