name: Dependency Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.11.1'
      - name: Audit Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-audit.txt
          pip-audit --require-hashes -r requirements.txt
          pip-audit --require-hashes -r gcp/kill_switch/requirements.txt
      - name: Check budget-alert tool without cloud access
        run: |
          python -m pip install --require-hashes -r gcp/kill_switch/requirements.txt
          python -m unittest discover gcp/kill_switch/tests
      - name: Audit JavaScript dependencies
        run: |
          npm install --global npm@12.2.0
          npm audit --audit-level=low
