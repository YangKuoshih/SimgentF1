name: Fuzz input boundaries
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    name: Fuzz input boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements.txt -r requirements-fuzz.txt
      - name: Coverage-guided fuzz smoke run
        run: |
          mkdir -p fuzz-artifacts
          cp -r tests/fuzz/corpus fuzz-artifacts/corpus
          python tests/fuzz/fuzz_boundaries.py fuzz-artifacts/corpus -max_total_time=60 -timeout=5 -max_len=4096 -artifact_prefix=fuzz-artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: synthetic-fuzz-failures
          path: fuzz-artifacts/
          retention-days: 7
