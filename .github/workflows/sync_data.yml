name: Auto-Sync F1 Data (fetch, verify, publish, deploy)

# Data only reaches main after it has been fetched from the sources (Jolpica, plus OpenF1
# for Sprint Qualifying), re-checked against Jolpica, passed the offline integrity gate
# and passed the agent evals. Any failing step stops the job before anything is published.
# Verified data is then committed to main and deployed to Cloud Run automatically.
#
# Jobs and credentials:
#   sync     fetch, verify and test with a read-only token; packages the data/cache changes.
#   publish  the only job with write access: the DATA_SYNC_DEPLOY_KEY deploy key, stored in
#            the 'data-publish' environment that only the main branch can use. It runs only
#            GitHub's own pinned actions, applies the patch to the latest main, refuses any
#            path outside data/cache/, and pushes. (The deploy key may bypass the PR rule on
#            main; deleting main or force-pushing stays blocked for everyone.)
#   deploy   rebuilds Cloud Run from main, only after a successful publish.

on:
  schedule:
    # Every 6 hours: picks up results, sprint/sprint-qualifying, grids and late corrections
    # for races in the last 21 days (jolpica_sync.RECENT_DAYS).
    - cron: '17 */6 * * *'
    # Wednesdays: full re-check of every cached season against Jolpica (older data can
    # still be corrected upstream).
    - cron: '43 3 * * 3'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year to sync'
        required: true
        default: '2026'
      full_revalidate:
        description: 'Also re-check every cached season against Jolpica'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: read
    name: Sync and verify F1 data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    env:
      YEAR: ${{ github.event.inputs.year || '2026' }}
      FULL: ${{ github.event.schedule == '43 3 * * 3' || github.event.inputs.full_revalidate == 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --require-hashes -r requirements.txt

      - name: 1. Fetch (Jolpica results, qualifying, sprints, grids, laps, pit stops; OpenF1 Sprint Qualifying)
        run: python -m app.tools.jolpica_sync "$YEAR" --laps

      - name: 1b. Fetch Sprint Qualifying / Shootout from OpenF1 (re-fetches the last 21 days)
        run: |
          if [ "$FULL" = "true" ]; then
            python -m app.tools.openf1_sync $(seq 2023 "$YEAR") --refresh
          else
            python -m app.tools.openf1_sync "$YEAR"
          fi

      - name: 2. Re-check cached files against Jolpica (replaces anything that drifted)
        run: |
          if [ "$FULL" = "true" ]; then
            YEARS=$(ls data/cache/jolpica | grep -oE '^[0-9]{4}' | sort -u | tr '\n' ' ')
          else
            YEARS="$YEAR"
          fi
          set +e
          python -m app.tools.revalidate $YEARS --budget 400
          rc=$?
          set -e
          # 2 = request budget used up (Jolpica allows ~500/hour); the rest is checked next run
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi

      - name: 3. Offline integrity gate (standings = results, real grids, real lap timing, manifest)
        run: python tests/check_data_integrity.py

      - name: 4. Agent evals on the new data
        run: |
          python tests/eval_cross_era.py
          python tests/eval_multi_turn.py
          python tests/eval_session_scope.py
          python tests/test_guardrails_matrix.py
          python tests/test_mcp_server.py

      - name: 5. Package the verified data changes
        id: package
        run: |
          git add -A data/cache/
          if git diff --staged --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --staged --binary -- data/cache/ > verified-data.patch
          git diff --staged --stat -- data/cache/ >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the patch for the publish job
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-data
          path: verified-data.patch
          retention-days: 7

  publish:
    name: Publish verified data to main
    needs: sync
    if: needs.sync.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: data-publish # holds DATA_SYNC_DEPLOY_KEY; only the main branch may use it
    permissions:
      contents: read
    outputs:
      published: ${{ steps.push.outputs.published }}
    steps:
      - name: Checkout main with the data deploy key
        # Keeps the SSH key configured for the git push below; this job runs no project code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: refs/heads/main
          ssh-key: ${{ secrets.DATA_SYNC_DEPLOY_KEY }}

      - name: Fetch the verified patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-data
          path: ${{ runner.temp }}/verified

      - name: Apply, check and push
        id: push
        env:
          YEAR: ${{ github.event.inputs.year || '2026' }}
          PATCH: ${{ runner.temp }}/verified/verified-data.patch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Only verified cache files may ever be published automatically.
          if git apply --numstat "$PATCH" | awk '{print $3}' | grep -v '^data/cache/'; then
            echo "::error::The patch touches files outside data/cache/; refusing to publish."
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if ! git apply --index "$PATCH"; then
              echo "::error::The verified patch no longer applies to main; the next sync will retry."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "main already has this data."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "chore(data): verified F1 data sync for $YEAR"
            if git push origin HEAD:refs/heads/main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Verified data pushed to main; deploying." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Could not push to main after 3 attempts."
          exit 1

  deploy:
    name: Deploy refreshed data to Cloud Run
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/deploy.yml
