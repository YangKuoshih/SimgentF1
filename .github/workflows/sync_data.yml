name: Auto-Sync F1 Data (fetch, verify, then propose)

# Data only reaches main after it has been fetched from the sources (Jolpica, plus OpenF1
# for Sprint Qualifying), re-checked against Jolpica, passed the offline integrity gate
# and passed the agent evals. Any failing step stops the job before anything is published.
# Verified data is then committed to main and deployed to Cloud Run automatically. If main
# rejects the push (branch protection), the data goes to a review branch instead and no
# deploy runs.

on:
  schedule:
    # Every 6 hours: picks up results, sprint/sprint-qualifying, grids and late corrections
    # for races in the last 21 days (jolpica_sync.RECENT_DAYS).
    - cron: '17 */6 * * *'
    # Wednesdays: full re-check of every cached season against Jolpica (older data can
    # still be corrected upstream).
    - cron: '43 3 * * 3'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year to sync'
        required: true
        default: '2026'
      full_revalidate:
        description: 'Also re-check every cached season against Jolpica'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
    name: Sync, verify and publish F1 data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    env:
      YEAR: ${{ github.event.inputs.year || '2026' }}
      FULL: ${{ github.event.schedule == '43 3 * * 3' || github.event.inputs.full_revalidate == 'true' }}

    steps:
      - name: Checkout Repository
        # Keeps the token: the job commits and pushes refreshed data (git push below).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --require-hashes -r requirements.txt

      - name: 1. Fetch (Jolpica results, qualifying, sprints, grids, laps, pit stops; OpenF1 Sprint Qualifying)
        run: python -m app.tools.jolpica_sync "$YEAR" --laps

      - name: 1b. Fetch Sprint Qualifying / Shootout from OpenF1 (re-fetches the last 21 days)
        run: |
          if [ "$FULL" = "true" ]; then
            python -m app.tools.openf1_sync $(seq 2023 "$YEAR") --refresh
          else
            python -m app.tools.openf1_sync "$YEAR"
          fi

      - name: 2. Re-check cached files against Jolpica (replaces anything that drifted)
        run: |
          if [ "$FULL" = "true" ]; then
            YEARS=$(ls data/cache/jolpica | grep -oE '^[0-9]{4}' | sort -u | tr '\n' ' ')
          else
            YEARS="$YEAR"
          fi
          set +e
          python -m app.tools.revalidate $YEARS --budget 400
          rc=$?
          set -e
          # 2 = request budget used up (Jolpica allows ~500/hour); the rest is checked next run
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi

      - name: 3. Offline integrity gate (standings = results, real grids, real lap timing, manifest)
        run: python tests/check_data_integrity.py

      - name: 4. Agent evals on the new data
        run: |
          python tests/eval_cross_era.py
          python tests/eval_multi_turn.py
          python tests/eval_session_scope.py
          python tests/test_guardrails_matrix.py
          python tests/test_mcp_server.py

      - name: 5. Publish verified data to main
        id: publish
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/cache/
          if git diff --staged --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only verified cache files may ever be published automatically.
          if git diff --staged --name-only | grep -v '^data/cache/'; then
            echo "::error::Files outside data/cache/ are staged; refusing to publish."
            exit 1
          fi
          git commit -m "chore(data): verified F1 data sync for $YEAR"
          published=false
          if [ "$REF" = "refs/heads/main" ]; then
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                published=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
          if [ "$published" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Verified data pushed to main; deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            # Not on main, or main refused the push: keep the old review-branch behaviour.
            git checkout -b "automation/verified-data-${RUN_ID}"
            git push origin HEAD
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Could not push to main. Open a pull request from automation/verified-data-${RUN_ID}; main requires review and CI." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy refreshed data to Cloud Run
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/deploy.yml
