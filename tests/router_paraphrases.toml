# Held-out paraphrases for the router (tests/eval_router.py --paraphrases).
#
# Written independently of agent/intents.toml: none of these may be copied into the intents'
# examples, or the score stops measuring how well the router handles new phrasings.
# Each entry: question = expected intent (or "none" when no intent should claim it).

[cases]
"who took the chequered flag" = "session_result"
"which driver won it" = "session_result"
"gimme the full results" = "session_result"
"who were the top three finishers" = "session_result"
"winner of the sprint race?" = "session_result"
"who triumphed at Silverstone" = "session_result"
"top five please" = "session_result"

"who grabbed pole" = "pole_position"
"pole sitter?" = "pole_position"
"who set the fastest time in qualifying" = "pole_position"
"who will start first on the grid after qualifying" = "pole_position"
"who claimed sprint pole position" = "pole_position"

"who ended up in 7th" = "finishing_position"
"which driver took P4" = "finishing_position"
"who crossed the line in second place" = "finishing_position"
"who was runner-up in Japan" = "finishing_position"
"who came last" = "finishing_position"

"how did Alonso get on" = "driver_result"
